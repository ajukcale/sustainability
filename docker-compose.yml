services:
  postgres:
    image: postgres:16-alpine
    container_name: sustainability-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sustainability
      POSTGRES_PASSWORD: sustainability
      POSTGRES_DB: sustainability
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sustainability -d sustainability"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
