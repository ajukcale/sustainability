name: CI

on:
  push:
    branches: [main, phase-1-iam]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install · Migrate · Test · Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sustainability
          POSTGRES_PASSWORD: sustainability
          POSTGRES_DB: sustainability
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sustainability -d sustainability"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sustainability:sustainability@localhost:5432/sustainability?schema=public
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_MFA_REQUIRED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Demote DB role (RLS requires non-superuser)
        run: pnpm --filter @sustainability/db demote-role

      - name: Seed system roles
        run: pnpm db:seed

      - name: Negative tenant isolation tests
        run: pnpm test:isolation

      - name: Build packages
        run: pnpm --filter @sustainability/db --filter @sustainability/auth build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build web
        run: pnpm --filter @sustainability/web build
